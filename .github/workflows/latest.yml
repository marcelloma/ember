name: Build and publish latest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, windows-x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Zig 0.16.0
        if: matrix.target == 'windows-x86_64'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build Linux Flatpak
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --assumeyes --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/org.ember.Launcher.json
          mkdir -p dist/packages
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo dist/packages/Ember-linux-x86_64.flatpak org.ember.Launcher
      - name: Smoke test installed Flatpak
        if: matrix.target == 'linux-x86_64'
        run: |
          flatpak install --user --assumeyes dist/packages/Ember-linux-x86_64.flatpak
          flatpak run --user --command=sh --env=SDL_VIDEODRIVER=dummy --env=SDL_AUDIODRIVER=dummy org.ember.Launcher -c 'export ORBIT_SCREENSHOT="$XDG_CACHE_HOME/library.bmp"; ember && test -s "$ORBIT_SCREENSHOT" && test -d "$XDG_DATA_HOME/Ember/roms/snes"'
      - name: Fetch Windows dependencies
        if: matrix.target == 'windows-x86_64'
        run: python3 tools/fetch_windows_deps.py
      - name: Build and check Windows
        if: matrix.target == 'windows-x86_64'
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe --prefix dist/windows-x86_64
          python3 tools/check_windows_package.py
      - name: Package Windows without ROMs
        if: matrix.target == 'windows-x86_64'
        run: |
          python3 tools/package_release.py "${{ matrix.target }}"
      - name: Calculate archive checksum
        run: |
          cd dist/packages
          sha256sum Ember-* > "${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error

  release:
    name: Update latest release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Update the rolling tag only after both packages have passed their checks.
          if gh api "repos/$GH_REPO/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$BUILD_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$BUILD_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated build of main at $BUILD_SHA.

          ROMs are not included.
          Linux: install Ember-linux-x86_64.flatpak with flatpak install --user ./Ember-linux-x86_64.flatpak
          Then launch with flatpak run org.ember.Launcher. The Freedesktop runtime is installed automatically.
          Place SNES ROMs in ~/.var/app/org.ember.Launcher/data/Ember/roms/snes/
          Windows: download and extract the entire zip archive.
          Windows: x86_64, SDL DLLs included; cross-compiled and statically checked.
          Windows runtime testing is still required.

          Build: https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}
          EOF
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest packages/* --clobber
            if gh release view latest --json assets --jq ' .assets[].name' | grep -Fxq Ember-0.1.0-linux-x86_64.tar.gz; then
              gh release delete-asset latest Ember-0.1.0-linux-x86_64.tar.gz --yes
            fi
            gh release edit latest --title "Latest main build" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create latest packages/* --verify-tag --title "Latest main build" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
